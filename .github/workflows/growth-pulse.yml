name: Growth Pulse

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual trigger reason"
        required: false
        default: "manual"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  growth-pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CELO_NETWORK: mainnet
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and run growth bot
        working-directory: ./multisig-growth-bot
        run: |
          for i in {1..3}; do
            echo "Growth bot iteration $i/3"
            npm install
            npm run start
          done

      - name: Install and run starter app
        working-directory: ./multisig-starter-app
        run: |
          for i in {1..3}; do
            echo "Starter app iteration $i/3"
            npm install
            npm run start
          done
